name: deliver-web

on:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - ".github/workflows/deliver-web.yml"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: minwarikan
      REGION: asia-northeast1
      SERVICE: minwari-api
      REPOSITORY: minwari

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_GITHUB_ACTIONS_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: webapp
        run: pnpm install --frozen-lockfile

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Install dotenvx (pinned)
        run: |
          DOTENVX_VERSION="1.51.4"
          DOTENVX_TARBALL="dotenvx-${DOTENVX_VERSION}-linux-amd64.tar.gz"
          DOTENVX_URL="https://github.com/dotenvx/dotenvx/releases/download/v${DOTENVX_VERSION}/${DOTENVX_TARBALL}"
          DOTENVX_SHA256="a427ef5e52200c8c411c696ca0374e122f775ba20087c35a6cd44d33ee07c412"
          curl -sSfL -o "$DOTENVX_TARBALL" "$DOTENVX_URL"
          echo "${DOTENVX_SHA256}  ${DOTENVX_TARBALL}" | sha256sum -c -
          tar -xzf "$DOTENVX_TARBALL"
          sudo install -m 0755 dotenvx /usr/local/bin/dotenvx

      - name: Decrypt .env.production
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          dotenvx decrypt -f webapp/.env.production --stdout > "$RUNNER_TEMP/oursplit.env.production"
          mv "$RUNNER_TEMP/oursplit.env.production" webapp/.env.production

      - name: Check and build static site
        working-directory: webapp
        run: |
          pnpm lint
          pnpm check
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Build Docker image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE:${{ github.sha }}"
          docker buildx build --platform linux/amd64 -t "$IMAGE" --load ./webapp
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Deploy read-only API to separate Cloud Run service
        run: |
          # Refuse to replace the legacy SSR service during coexistence.
          test "$SERVICE" = "minwari-api"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --service-account "minwari-api-reader@$PROJECT_ID.iam.gserviceaccount.com" \
            --clear-env-vars \
            --port 8080 \
            --max-instances 10 \
            --memory "256Mi" \
            --min-instances 0 \
            --cpu 1 \
            --cpu-throttling \
            --quiet

      - name: Verify API before publishing static site
        run: |
          API_URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$API_URL/api/health"

      - name: Deploy static site to Firebase Hosting
        run: pnpm dlx firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" --non-interactive
